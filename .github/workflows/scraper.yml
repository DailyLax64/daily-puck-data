name: Daily Puck Scraper

on:
  schedule:
    - cron: '0 */2 * * *' # Automatically runs every 2 hours
  workflow_dispatch:        # Allows manual run from GitHub UI

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Ingestion Pipeline
        run: node ingest.js

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Daily Puck Cloud Bot"
          git add hockey_stats.json scores/
          git commit -m "🤖 Auto-update hockey data [skip ci]" || echo "No changes to commit"
          git push

name: GameSheet League Scanner

on:
  workflow_dispatch:
    inputs:
      start_id:
        description: 'Start Season ID'
        required: true
        default: '15500'
      end_id:
        description: 'End Season ID'
        required: true
        default: '16500'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Run GameSheet Scanner Script
        run: |
          python3 -c "
          import urllib.request
          import json
          import concurrent.futures
          import csv
          import re
          import html

          START_ID = int('${{ github.event.inputs.start_id }}')
          END_ID = int('${{ github.event.inputs.end_id }}')

          BROWSER_UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'

          def fetch_tournament_title(sid):
              try:
                  page_url = f'https://gamesheetstats.com/seasons/{sid}/games'
                  req = urllib.request.Request(
                      page_url,
                      headers={'User-Agent': BROWSER_UA, 'Accept': 'text/html,application/xhtml+xml'}
                  )
                  with urllib.request.urlopen(req, timeout=6) as resp:
                      page_html = resp.read().decode('utf-8', errors='ignore')

                      # 1. Check OpenGraph meta tag
                      og = re.search(r'<meta\s+property=[\"\']og:title[\"\']\s+content=[\"\'](.*?)[\"\']', page_html, re.I)
                      raw_title = og.group(1) if og else None

                      # 2. Check HTML <title> tag
                      if not raw_title:
                          t = re.search(r'<title>(.*?)</title>', page_html, re.I | re.DOTALL)
                          if t:
                              raw_title = t.group(1)

                      if raw_title:
                          clean = raw_title.strip()
                          # Strip generic GameSheet page prefixes and suffixes
                          clean = re.sub(r'^(?:Games|Scores|Schedule|Standings|Stats)\s*\|\s*', '', clean, flags=re.I)
                          clean = re.sub(r'\s*\|\s*GameSheet.*$', '', clean, flags=re.I)
                          clean = re.sub(r'\s*-\s*GameSheet.*$', '', clean, flags=re.I)
                          return html.unescape(clean).strip()
              except Exception:
                  pass
              return None

          def check_season(sid):
              api_url = f'https://gamesheetstats.com/api/unified-games/{sid}'
              req = urllib.request.Request(
                  api_url, 
                  headers={'User-Agent': 'DailyPuckScanner/1.0', 'Accept': 'application/json'}
              )
              try:
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      if resp.status == 200:
                          data = json.loads(resp.read().decode('utf-8'))
                          games = data.get('data', [])
                          if games:
                              g0 = games[0]
                              home = g0.get('home', {}).get('title', '')
                              visitor = g0.get('visitor', {}).get('title', '')
                              div = (
                                  g0.get('division', {}).get('title') or 
                                  g0.get('divisionTitle') or 
                                  g0.get('bracket', {}).get('title') or 
                                  ''
                              )
                              venue = g0.get('location', '')

                              # Pull the full tournament name from the web page header
                              tourney_name = fetch_tournament_title(sid)
                              if not tourney_name:
                                  tourney_name = f'Tournament ID {sid}'

                              return {
                                  'id': sid,
                                  'tournament_name': tourney_name,
                                  'game_count': len(games),
                                  'sample_matchup': f'{home} vs {visitor}',
                                  'division': div,
                                  'venue': venue,
                                  'link': f'https://gamesheetstats.com/seasons/{sid}/games'
                              }
              except Exception:
                  pass
              return None

          print(f'Starting scan from ID {START_ID} to {END_ID}...')
          results = []

          with concurrent.futures.ThreadPoolExecutor(max_workers=30) as executor:
              futures = {executor.submit(check_season, sid): sid for sid in range(START_ID, END_ID + 1)}
              for f in concurrent.futures.as_completed(futures):
                  res = f.result()
                  if res:
                      print(f'Found [{res[\"id\"]}]: {res[\"tournament_name\"]} ({res[\"game_count\"]} games)')
                      results.append(res)

          # Sort numerically by ID
          results.sort(key=lambda x: x['id'])

          output_file = 'gamesheet_leagues_${{ github.event.inputs.start_id }}_${{ github.event.inputs.end_id }}.csv'
          with open(output_file, 'w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(
                  f, 
                  fieldnames=['id', 'tournament_name', 'game_count', 'sample_matchup', 'division', 'venue', 'link']
              )
              writer.writeheader()
              writer.writerows(results)

          print(f'Scan completed! Found {len(results)} active tournaments.')
          "

      - name: Upload CSV Spreadsheet
        uses: actions/upload-artifact@v4
        with:
          name: gamesheet-leagues-csv
          path: gamesheet_leagues_*.csv
          retention-days: 7

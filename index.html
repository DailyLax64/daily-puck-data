<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Daily Puck | Multi-League Scoreboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.25s ease-out forwards; }
        .neon-glow-cyan { box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
        .neon-glow-violet { box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white text-sm">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white shadow-xl border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
            
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-r from-cyan-500 to-blue-600 font-black px-3 py-1.5 rounded-lg text-xl tracking-tight uppercase shadow-md transform -skew-x-6">
                    Daily Puck
                </div>
                <div class="flex flex-col">
                    <span class="text-xs font-black tracking-widest text-cyan-400 uppercase leading-none">Live Network</span>
                    <span id="sync-status" class="text-[10px] text-slate-400 font-mono">Checking feed...</span>
                </div>
            </div>

            <!-- The Co-Ed vs Girls Switcher -->
            <div class="inline-flex rounded-xl bg-slate-950 p-1 border border-slate-800 shadow-inner">
                <button onclick="setCircuit('co-ed')" id="btn-coed" class="px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider bg-cyan-500 text-white shadow-md neon-glow-cyan transition-all">
                    Co-Ed (OMHA/GTHL)
                </button>
                <button onclick="setCircuit('girls')" id="btn-girls" class="px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider text-slate-400 hover:text-white transition-all">
                    Girls (OWHA)
                </button>
            </div>
            
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="max-w-6xl w-full mx-auto px-3 sm:px-4 py-6 sm:py-8 flex-grow">
        
        <!-- Scoreboard Controls -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 text-white mb-6">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🏒</span>
                <div>
                    <h3 class="text-base sm:text-lg font-black uppercase tracking-tight text-white">Central Scoreboard</h3>
                    <p class="text-xs font-mono text-slate-400">Integrated league and tournament results.</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                <label class="text-xs font-mono font-bold uppercase text-slate-400 hidden sm:inline">Division:</label>
                <select id="division-filter" onchange="renderScoreboard()" style="color-scheme: dark;" class="w-full sm:w-auto bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold uppercase tracking-wider text-white focus:outline-none focus:border-cyan-400 cursor-pointer">
                    <option value="">All Divisions</option>
                </select>
            </div>
        </div>

        <!-- 2-Column Responsive Scoreboard -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 sm:gap-6 items-start">
            
            <!-- LEFT: COMPLETED RESULTS -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl space-y-4">
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 border-b border-slate-800 pb-3 sm:pb-4">
                    <div class="flex justify-between items-baseline sm:block">
                        <h4 class="text-sm font-black uppercase tracking-widest text-cyan-400 drop-shadow-[0_0_6px_rgba(34,211,238,0.2)]">🏁 Final Scores</h4>
                        <span id="results-count" class="text-xs font-mono text-slate-400">0 Games</span>
                    </div>
                    <div class="flex items-center space-x-2 w-full sm:w-auto justify-between sm:justify-end">
                        <button onclick="stepDate('results', -1)" class="w-9 h-9 sm:w-8 sm:h-8 rounded-lg bg-slate-950 border border-slate-800 hover:border-cyan-500 text-cyan-400 font-black transition-colors focus:outline-none active:scale-95">◀</button>
                        <div id="results-date-pill" class="flex-1 sm:flex-initial px-3 py-2 sm:py-1 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono font-bold text-slate-200 min-w-[140px] text-center select-none truncate">...</div>
                        <button onclick="stepDate('results', 1)" class="w-9 h-9 sm:w-8 sm:h-8 rounded-lg bg-slate-950 border border-slate-800 hover:border-cyan-500 text-cyan-400 font-black transition-colors focus:outline-none active:scale-95">▶</button>
                    </div>
                </div>
                <div id="results-list" class="space-y-3"></div>
            </div>

            <!-- RIGHT: UPCOMING MATCHUPS -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl space-y-4">
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 border-b border-slate-800 pb-3 sm:pb-4">
                    <div class="flex justify-between items-baseline sm:block">
                        <h4 class="text-sm font-black uppercase tracking-widest text-cyan-400 drop-shadow-[0_0_6px_rgba(34,211,238,0.2)]">📅 Scheduled</h4>
                        <span id="matchups-count" class="text-xs font-mono text-slate-400">0 Games</span>
                    </div>
                    <div class="flex items-center space-x-2 w-full sm:w-auto justify-between sm:justify-end">
                        <button onclick="stepDate('matchups', -1)" class="w-9 h-9 sm:w-8 sm:h-8 rounded-lg bg-slate-950 border border-slate-800 hover:border-cyan-500 text-cyan-400 font-black transition-colors focus:outline-none active:scale-95">◀</button>
                        <div id="matchups-date-pill" class="flex-1 sm:flex-initial px-3 py-2 sm:py-1 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono font-bold text-slate-200 min-w-[140px] text-center select-none truncate">...</div>
                        <button onclick="stepDate('matchups', 1)" class="w-9 h-9 sm:w-8 sm:h-8 rounded-lg bg-slate-950 border border-slate-800 hover:border-cyan-500 text-cyan-400 font-black transition-colors focus:outline-none active:scale-95">▶</button>
                    </div>
                </div>
                <div id="matchups-list" class="space-y-3"></div>
            </div>

        </div>
    </main>

    <script>
        let rawDb = { games: [] };
        let activeCircuit = 'co-ed'; 
        let resultsDate = '';
        let matchupsDate = '';

        // --- Core Initialization ---
        async function loadHockeyDatabase() {
            try {
                // Pointing to the local JSON file populated by GitHub Actions
                const res = await fetch('hockey_stats.json?v=' + Date.now());
                if (!res.ok) throw new Error('Data file not found');
                rawDb = await res.json();

                const d = new Date(rawDb.generated_at);
                document.getElementById('sync-status').innerText = `Synced: ${d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                
                updateDivisionDropdown();
                initDates();
                renderScoreboard();
            } catch (err) {
                console.error(err);
                document.getElementById('sync-status').innerText = "Database Offline";
                document.getElementById('sync-status').className = "text-[10px] text-rose-500 font-mono font-bold";
            }
        }

        // --- Circuit Switching (Co-Ed vs Girls) ---
        function setCircuit(circuit) {
            activeCircuit = circuit;
            
            const btnCoed = document.getElementById('btn-coed');
            const btnGirls = document.getElementById('btn-girls');
            const activeClass = "px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider bg-cyan-500 text-white shadow-md neon-glow-cyan transition-all";
            const inactiveClass = "px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider text-slate-400 hover:text-white transition-all";

            // If switching to girls, change the theme color slightly for visual feedback
            if (circuit === 'girls') {
                btnGirls.className = activeClass.replace('bg-cyan-500', 'bg-violet-500').replace('neon-glow-cyan', 'neon-glow-violet');
                btnCoed.className = inactiveClass;
            } else {
                btnCoed.className = activeClass;
                btnGirls.className = inactiveClass;
            }

            // Reset filters and recalculate dates for the new circuit
            document.getElementById('division-filter').value = "";
            updateDivisionDropdown();
            initDates();
            renderScoreboard();
        }

        // --- Dropdown Management ---
        function updateDivisionDropdown() {
            const select = document.getElementById('division-filter');
            select.innerHTML = '<option value="">All Divisions</option>';
            
            const circuitGames = rawDb.games.filter(g => g.gender === activeCircuit);
            const divisions = Array.from(new Set(circuitGames.map(g => g.division))).filter(Boolean).sort();
            
            divisions.forEach(div => {
                select.innerHTML += `<option value="${div}">${div}</option>`;
            });
        }

        // --- Date Logic ---
        function getTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
        
        function shiftDate(dateStr, days) {
            if(!dateStr) return getTodayStr();
            const p = dateStr.split('-');
            const d = new Date(p[0], p[1]-1, p[2]);
            d.setDate(d.getDate() + days);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function formatPillDate(dateStr) {
            if (!dateStr) return "N/A";
            const today = getTodayStr();
            const p = dateStr.split('-');
            const d = new Date(p[0], p[1]-1, p[2]);
            const formatted = `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}, ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]} ${d.getDate()}`;
            
            if (dateStr === today) return `Today (${formatted})`;
            if (dateStr === shiftDate(today, -1)) return `Yesterday (${formatted})`;
            if (dateStr === shiftDate(today, 1)) return `Tomorrow (${formatted})`;
            return formatted;
        }

        function initDates() {
            const today = getTodayStr();
            const circuitGames = rawDb.games.filter(g => g.gender === activeCircuit);
            
            // Results: Find most recent day with a final score
            const finalDates = Array.from(new Set(circuitGames.filter(g => g.status === 'final').map(g => g.date))).sort();
            const pastCompleted = finalDates.filter(d => d <= today);
            resultsDate = pastCompleted.length > 0 ? pastCompleted[pastCompleted.length - 1] : shiftDate(today, -1);

            // Matchups: Find next day with a scheduled game
            const schedDates = Array.from(new Set(circuitGames.filter(g => g.status !== 'final').map(g => g.date))).sort();
            const futureSched = schedDates.filter(d => d >= today);
            matchupsDate = futureSched.length > 0 ? futureSched[0] : today;
        }

        function stepDate(type, delta) {
            if (type === 'results') resultsDate = shiftDate(resultsDate, delta);
            else matchupsDate = shiftDate(matchupsDate, delta);
            renderScoreboard();
        }

        function jumpToDate(type, targetDate) {
            if (type === 'results') resultsDate = targetDate;
            else matchupsDate = targetDate;
            renderScoreboard();
        }

        // --- Rendering ---
        function renderScoreboard() {
            const activeDiv = document.getElementById('division-filter').value;
            
            document.getElementById('results-date-pill').innerText = formatPillDate(resultsDate);
            document.getElementById('matchups-date-pill').innerText = formatPillDate(matchupsDate);

            // Filter
            const circuitGames = rawDb.games.filter(g => g.gender === activeCircuit && (!activeDiv || g.division === activeDiv));
            const completed = circuitGames.filter(g => g.date === resultsDate && g.status === 'final');
            const scheduled = circuitGames.filter(g => g.date === matchupsDate && g.status !== 'final');

            document.getElementById('results-count').innerText = `${completed.length} Games`;
            document.getElementById('matchups-count').innerText = `${scheduled.length} Scheduled`;

            // Draw Completed
            const resContainer = document.getElementById('results-list');
            resContainer.innerHTML = '';
            if (completed.length > 0) {
                completed.forEach(g => resContainer.innerHTML += buildCard(g, true));
            } else {
                // Find nearest fallback date
                const finalDates = Array.from(new Set(circuitGames.filter(g => g.status === 'final').map(g => g.date))).sort();
                const latest = finalDates.length > 0 ? finalDates[finalDates.length - 1] : null;
                const jumpBtn = (latest && latest !== resultsDate) 
                    ? `<button onclick="jumpToDate('results', '${latest}')" class="mt-3 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-bold uppercase rounded-lg transition-colors">Jump to ${formatPillDate(latest)}</button>` 
                    : '';
                resContainer.innerHTML = `<div class="py-10 text-center border border-dashed border-slate-700 rounded-xl bg-slate-950"><span class="text-2xl mb-2 block">🤷‍♂️</span><span class="text-slate-500 font-mono text-xs uppercase">No results for this date.</span>${jumpBtn}</div>`;
            }

            // Draw Matchups
            const matchContainer = document.getElementById('matchups-list');
            matchContainer.innerHTML = '';
            if (scheduled.length > 0) {
                scheduled.forEach(g => matchContainer.innerHTML += buildCard(g, false));
            } else {
                const today = getTodayStr();
                const schedDates = Array.from(new Set(circuitGames.filter(g => g.status !== 'final').map(g => g.date))).sort();
                const next = schedDates.find(d => d >= today) || (schedDates.length > 0 ? schedDates[0] : null);
                const jumpBtn = (next && next !== matchupsDate) 
                    ? `<button onclick="jumpToDate('matchups', '${next}')" class="mt-3 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-bold uppercase rounded-lg transition-colors">Jump to ${formatPillDate(next)}</button>` 
                    : '';
                matchContainer.innerHTML = `<div class="py-10 text-center border border-dashed border-slate-700 rounded-xl bg-slate-950"><span class="text-2xl mb-2 block">📅</span><span class="text-slate-500 font-mono text-xs uppercase">No games scheduled.</span>${jumpBtn}</div>`;
            }
        }

        function buildCard(g, isCompleted) {
            const isTourney = g.source_type === 'tournament';
            const tourneyPill = isTourney 
                ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-black uppercase bg-violet-900/50 border border-violet-500/50 text-violet-300">Tournament</span>`
                : `<span class="px-1.5 py-0.5 rounded text-[10px] font-black uppercase bg-slate-800 border border-slate-600 text-slate-300">League</span>`;
            
            const themeColor = activeCircuit === 'girls' ? 'violet' : 'cyan';

            if (isCompleted) {
                const hWon = g.home_goals > g.visitor_goals;
                const vWon = g.visitor_goals > g.home_goals;
                const isTie = g.home_goals === g.visitor_goals;

                const vClass = vWon ? "font-black text-emerald-400" : (isTie ? "font-bold text-slate-200" : "text-slate-400");
                const hClass = hWon ? "font-black text-emerald-400" : (isTie ? "font-bold text-slate-200" : "text-slate-400");
                const vScoreClass = vWon ? "text-emerald-400 font-black text-xl" : "text-slate-300 font-bold text-lg";
                const hScoreClass = hWon ? "text-emerald-400 font-black text-xl" : "text-slate-300 font-bold text-lg";

                return `
                    <div class="bg-slate-950 border border-slate-800 hover:border-slate-700 rounded-xl p-3.5 shadow-sm transition-colors animate-fade">
                        <div class="flex items-center justify-between text-[11px] mb-2 font-mono border-b border-slate-800/60 pb-2">
                            <div class="flex items-center space-x-2 truncate">
                                <span class="px-2 py-0.5 rounded font-black uppercase text-${themeColor}-400 bg-${themeColor}-950/60 border border-${themeColor}-800/50 text-[10px]">${g.division}</span>
                                <span class="text-slate-400 truncate max-w-[150px]">${g.source_name}</span>
                            </div>
                            <div class="flex-shrink-0">${tourneyPill}</div>
                        </div>
                        <div class="space-y-1.5 py-1">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-2 truncate">
                                    <span class="text-xs text-slate-500 uppercase font-mono w-4">V</span>
                                    <span class="font-sans uppercase tracking-tight truncate ${vClass}">${g.visitor_name}</span>
                                </div>
                                <span class="font-mono ${vScoreClass} ml-3">${g.visitor_goals}</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-2 truncate">
                                    <span class="text-xs text-slate-500 uppercase font-mono w-4">H</span>
                                    <span class="font-sans uppercase tracking-tight truncate ${hClass}">${g.home_name}</span>
                                </div>
                                <span class="font-mono ${hScoreClass} ml-3">${g.home_goals}</span>
                            </div>
                        </div>
                        <div class="mt-2 text-[10px] font-mono text-slate-500 text-right uppercase tracking-wider">
                            ${g.status === 'final' ? 'Final' : 'In Progress'}
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="bg-slate-950 border border-slate-800 hover:border-slate-700 rounded-xl p-3.5 shadow-sm transition-colors animate-fade">
                        <div class="flex items-center justify-between text-[11px] mb-2 font-mono border-b border-slate-800/60 pb-2">
                            <div class="flex items-center space-x-2 truncate">
                                <span class="px-2 py-0.5 rounded font-black uppercase text-${themeColor}-400 bg-${themeColor}-950/60 border border-${themeColor}-800/50 text-[10px]">${g.division}</span>
                                <span class="text-slate-400 truncate max-w-[150px]">${g.source_name}</span>
                            </div>
                            <div class="flex-shrink-0">${tourneyPill}</div>
                        </div>
                        <div class="py-2 flex items-center justify-between">
                            <div class="flex-1 space-y-1.5 truncate">
                                <div class="flex items-center space-x-2 truncate">
                                    <span class="text-xs text-slate-500 uppercase font-mono w-4">V</span>
                                    <span class="font-sans font-bold uppercase tracking-tight truncate text-slate-200">${g.visitor_name}</span>
                                </div>
                                <div class="flex items-center space-x-2 truncate">
                                    <span class="text-xs text-slate-500 uppercase font-mono w-4">H</span>
                                    <span class="font-sans font-bold uppercase tracking-tight truncate text-slate-200">${g.home_name}</span>
                                </div>
                            </div>
                            <div class="ml-3 text-right flex-shrink-0">
                                <span class="block text-sm font-mono font-black text-${themeColor}-400 whitespace-nowrap">${g.time || 'TBD'}</span>
                                <span class="text-[10px] font-mono text-slate-500 uppercase">Puck Drop</span>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // Boot
        document.addEventListener('DOMContentLoaded', loadHockeyDatabase);
    </script>
</body>
</html>
